name: Build, Test, Deploy (Render)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_test_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Test frontend
        run: npm run test:frontend

      - name: Build app bundle
        run: npm run build

